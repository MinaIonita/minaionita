# Reverse proxy pentru minaionita.ro (cPanel / Apache 2.4).
#
# Se copiază în:
#   /etc/apache2/conf.d/userdata/ssl/2_4/USERUL/minaionita.ro/proxy.conf
# apoi:
#   /scripts/ensure_vhost_includes --user=USERUL && /scripts/restartsrv_httpd
#
# Editarea directă a httpd.conf nu ține: cPanel îl regenerează.

ProxyPreserveHost On
ProxyTimeout 60

# Fișierele statice generate de Next.js sunt imutabile (hash în nume), deci pot
# fi cache-uite agresiv. Le lăsăm tot prin proxy — Next le servește cu
# headerele corecte — dar fără să le mai transforme Apache.
ProxyPass /_next/static http://127.0.0.1:3000/_next/static retry=0
ProxyPassReverse /_next/static http://127.0.0.1:3000/_next/static

# API-ul trebuie declarat ÎNAINTEA rădăcinii, altfel /api ajunge la Next.js
# și primești 404 pe fiecare cerere din admin.
ProxyPass /api http://127.0.0.1:4000/api retry=0
ProxyPassReverse /api http://127.0.0.1:4000/api

ProxyPass / http://127.0.0.1:3000/ retry=0
ProxyPassReverse / http://127.0.0.1:3000/

# Next.js are nevoie de IP-ul real pentru rate limiting și pentru jurnalul de
# consimțământ; API-ul are trust proxy = 1 și citește exact aceste headere.
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
