# nginx pentru minaionita.ro — reverse proxy către cele două procese Node.
#
# Ubuntu:  /etc/nginx/sites-available/minaionita.ro  + symlink în sites-enabled
#
# certbot --nginx rescrie fișierul ca să adauge blocul SSL și redirectul de pe
# 80; nu edita manual ce adaugă el.

upstream mina_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mina_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name minaionita.ro www.minaionita.ro;

    # Formularul de contact și importurile din admin pot depăși valoarea implicită.
    client_max_body_size 12m;

    # Compresie pentru text; imaginile sunt deja webp și nu câștigă nimic.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # ── API ──────────────────────────────────────────────────────────────────
    # Declarat ÎNAINTEA rădăcinii. Invers, /api ar fi prins de location / și
    # fiecare cerere din panoul de administrare ar primi 404 de la Next.js.
    location /api/ {
        proxy_pass http://mina_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # API-ul are trust proxy = 1 și citește exact aceste headere pentru
        # rate limiting și pentru jurnalul de consimțământ. Fără ele, toți
        # vizitatorii ar arăta ca un singur client și s-ar bloca reciproc.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # ── Static Next.js ───────────────────────────────────────────────────────
    # Numele conțin hash, deci conținutul e imutabil: se poate cache-ui la
    # maximum fără risc de a servi o versiune veche după deploy.
    location /_next/static/ {
        proxy_pass http://mina_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Site ─────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://mina_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Nu duplica headerele de securitate aici: Next.js le trimite deja din
    # next.config.ts, iar CSP-ul cu nonce vine din proxy.ts. Setate în două
    # locuri, ajung în conflict și greu de depanat.
}
